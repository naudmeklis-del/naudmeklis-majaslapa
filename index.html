<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="naudmeklislogobezteksta.png">
  <title>Naudmeklis</title>

  <!-- Fonts: DM Sans (Regular 400 un Bold 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- Leaflet kartes izskats -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- mans izskats -->
  <link rel="stylesheet" href="style.css">
  <!--<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7750393781152096"
     crossorigin="anonymous"></script> -->
</head>

<body>

  <!-- Augšējā josla -->
  <div class="josla">
    <img src="naudmeklislogoarsaukli.png" class="logo" alt="Naudmeklis">
    <div>
      <button id="btn-filtri" class="pievienot-btn filtri-btn">Filtri</button>
      <button id="btn-mani" style="display: none;" class="manisludinajumi-btn">Mans profils</button>
      <button id="btn-pievienot" style="display: none;" class="pievienot-btn">Pievienot haltūru</button>
      <button id="btn-pieslegties" class="pieslegties-btn">Pieslēgties / Reģistrēties</button>
      <button id="btn-iziet" style="display: none;" class="iziet-btn">Iziet</button>
    </div>
  </div>

  <!-- Šeit parādīsies karte -->
  <div class="saturs">

  <aside class="filtri-panel" id="filtri-panel">

    <!-- Virsraksts un "Notīrīt filtrus" -->
    <div class="filtri-galva">
      <h3 class="filtri-virsraksts">
        <svg class="ikona" viewBox="0 0 24 24" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtri
      </h3>
      <button id="btn-notirit" class="saite-btn" type="button">
        Notīrīt filtrus
        <svg class="ikona" viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>

    <!-- Meklēšana -->
    <div class="filtri-meklet">
      <svg class="ikona" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="f-meklet" placeholder="Meklēt" aria-label="Meklēt">
    </div>

    <!-- Kategorijas (pogas tiek izveidotas no app.js) -->
    <div class="filtri-sadala">
      <div class="filtri-nosaukums">
        <svg class="ikona" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Kategorijas
      </div>
      <div id="f-kategorijas" class="chips"></div>
    </div>

    <!-- Cena -->
    <div class="filtri-sadala">
      <div class="filtri-nosaukums">
        <span class="euro-ikona" aria-hidden="true">€</span>
        Alga
      </div>
      <div class="cena-rinda">
        <input type="number" id="f-min" placeholder="Min (€)" aria-label="Minimālā cena">
        <span class="cena-svitra">–</span>
        <input type="number" id="f-max" placeholder="Max (€)" aria-label="Maksimālā cena">
      </div>
    </div>

    <label><input class="ampaksats-check" type="checkbox" id="f-apmaksatas"> Rādīt tikai apmaksātās</label>

  </aside>

  <div class="karte-wrap">
    <div id="karte"></div>

    <!-- Kartīte kartes apakšējā kreisajā stūrī: "Atrastas haltūras: N" -->
    <div class="rezultatu-karte">
      <span class="rezultatu-ikona">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      </span>
      <span id="f-rezultati"></span>
    </div>
  </div>

</div>

<footer class="footer">
  <a href="par-mums.html">Par mums</a>
  <a href="lietosanas-noteikumi.html">Lietošanas noteikumi</a>
  <a href="privatuma-politika.html">Privātuma politika</a>
</footer>

  <dialog id="auth-logs">

  <!-- 1. skats: PIESLĒGŠANĀS (atveras pirmais) -->
  <section id="auth-login-skats">
    <h3 class="authdialog-title">Pieslēgties</h3>
    <form id="login-forma" novalidate>
      <div class="auth-lauks">
        <label for="login-epasts">E-pasts</label>
        <input type="email" id="login-epasts" autocomplete="email" placeholder="piemers@epasts.lv">
      </div>
      <div class="auth-lauks">
        <label for="login-parole">Parole</label>
        <input type="password" id="login-parole" autocomplete="current-password" placeholder="Tava parole">
      </div>
      <p class="auth-zinojums" id="login-zinojums" role="alert"></p>
      <button type="submit" class="btn-login auth-submit" id="btn-login">Pieslēgties</button>
    </form>
    <p class="auth-parslegt">
      Nav konta?
      <button type="button" class="auth-saite" id="btn-uz-registraciju">Reģistrēties</button>
    </p>
  </section>

  <!-- 2. skats: REĢISTRĀCIJA (parādās, kad uzspiež "Reģistrēties") -->
  <section id="auth-register-skats" hidden>
    <h3 class="authdialog-title">Izveidot kontu</h3>
    <form id="register-forma" novalidate>
      <div class="auth-lauks">
        <label for="reg-epasts">E-pasts</label>
        <input type="email" id="reg-epasts" autocomplete="email" placeholder="piemers@epasts.lv">
      </div>
      <div class="auth-lauks">
        <label for="reg-parole">Parole</label>
        <input type="password" id="reg-parole" autocomplete="new-password" placeholder="Vismaz 6 simboli">
      </div>
      <div class="auth-lauks">
        <label for="reg-parole2">Atkārto paroli</label>
        <input type="password" id="reg-parole2" autocomplete="new-password" placeholder="Ieraksti paroli vēlreiz">
      </div>
      <p class="auth-zinojums" id="reg-zinojums" role="alert"></p>
      <button type="submit" class="btn-register auth-submit" id="btn-register">Reģistrēties</button>
    </form>
    <p class="auth-parslegt">
      Jau ir konts?
      <button type="button" class="auth-saite" id="btn-uz-pieslegsanos">Pieslēgties</button>
    </p>
  </section>

  <div class="auth-aizvert-rinda">
    <button type="button" class="btn-aizvert" id="btn-aizvert">Aizvērt</button>
  </div>
</dialog>

<dialog id="haltura-logs">
  <h3>Pievienot haltūru</h3>
  <input type="text" id="h-nosaukums" placeholder="Nosaukums"><br><br>
  <select id="h-kategorija">
    <!-- Kategorijas tiek ielādētas no app.js (saraksts "kategorijas") -->
  </select><br><br>
<input type="number" id="h-cena" placeholder="Cena (€)"><br><br>

<textarea id="h-apraksts" placeholder="Apraksts (kas jādara, kad, kur tieši, kontaktinformācija)" maxlength="500" rows="4" style="width: 100%;"></textarea><br><br>

<button id="btn-saglabat">Saglabāt</button>
  <button id="btn-atcelt">Atcelt</button>
  <p id="h-zinojums"></p>
</dialog>

<dialog id="mani-logs">
  <h3>Mans profils</h3>

  <div class="profils-galva">
    <div class="profils-avatars" id="profils-avatars">?</div>
    <div>
      <div class="profils-epasts" id="profils-epasts"></div>
      <div class="profils-vertejums" id="profils-vertejums">☆☆☆☆☆ Vērtējumi drīzumā</div>
    </div>
  </div>

  <!-- Cilnes: Mani sludinājumi | Favorīti -->
  <div class="profils-tabi">
    <button type="button" class="profils-tab aktivs" id="tab-sludinajumi">Mani sludinājumi</button>
    <button type="button" class="profils-tab" id="tab-favoriti">★ Favorīti</button>
  </div>

  <div id="panelis-sludinajumi">
    <div id="mani-saraksts"></div>
  </div>

  <div id="panelis-favoriti" hidden>
    <div id="favoritu-saraksts"></div>
  </div>
  <br>
  <button id="btn-mani-aizvert">Aizvērt</button>
</dialog>

<dialog id="zinot-logs">
  <h3>Ziņot par sludinājumu</h3>
  <select id="z-iemesls">
    <option>Krāpniecība</option>
    <option>Nepiemērots saturs</option>
    <option>Nepareiza informācija</option>
    <option>Surogātpasts (spams)</option>
    <option>Cits</option>
  </select><br><br>
  <textarea id="z-komentars" placeholder="Komentārs (nav obligāts)" maxlength="300" rows="3"></textarea><br><br>
  <button id="btn-z-sutit">Nosūtīt</button>
  <button id="btn-z-atcelt">Atcelt</button>
  <p id="z-zinojums"></p>
</dialog>

  <!-- Vispirms Leaflet bibliotēka, pēc tam kods -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
